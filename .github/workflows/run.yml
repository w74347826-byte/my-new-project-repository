name: Run Python
on: [push, workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python age_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: age-graph
          path: age_graph.png
